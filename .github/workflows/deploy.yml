name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Деплої стають у чергу, а не скасовують один одного посеред заливки.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 89.167.1.191
  DEPLOY_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGmnVfNuSncQcJ5y4JFH8BtrxTH1M3PKwZDE+MHMRLj6
  SITE_URL: https://ladder.thunderpw.fun

jobs:
  server:
    name: Deploy to ladder.thunderpw.fun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Ключ на сервері прив'язаний до forced command deploy-site: він уміє
      # лише розпакувати tar.gz у новий реліз і перемкнути на нього сайт.
      - name: Upload release
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_HOST $DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          tar -C dist -czf - . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "deploy@$DEPLOY_HOST" "deploy ladder ${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"

      - name: Smoke test
        run: |
          expected=$(grep -o '/assets/index-[^"]*\.js' dist/index.html)
          live=$(curl -fsS "$SITE_URL/" | grep -o '/assets/index-[^"]*\.js')
          echo "expected $expected, live $live"
          test "$expected" = "$live"
          curl -fsS -o /dev/null "$SITE_URL$expected"
          curl -fsS -o /dev/null "$SITE_URL/admin"

  # Стара адреса tayforn.github.io/pw-ladder/ лише перенаправляє на новий домен.
  # Публікується тільки після успішного деплою на сервер.
  pages-build:
    name: Build GitHub Pages redirect
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _redirect
          cp .github/pages-redirect/index.html _redirect/index.html
          cp .github/pages-redirect/index.html _redirect/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _redirect

  pages-deploy:
    name: Publish GitHub Pages redirect
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
